name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm install

      - name: Build web app
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
        run: npx vite build

      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace > /tmp/gradle.log 2>&1 || (tail -c 60000 /tmp/gradle.log && exit 1)

      - name: Post debug info to issue
        if: failure()
        run: |
          python3 -c "
          import json, urllib.request
          try:
              body = open('/tmp/gradle.log').read()[-60000:]
          except FileNotFoundError:
              body = 'no gradle.log'
          payload = json.dumps({'title': 'Debug run ${{ github.run_id }}', 'body': '\`\`\`\n' + body + '\n\`\`\`'}).encode()
          req = urllib.request.Request(
              'https://api.github.com/repos/${{ github.repository }}/issues',
              data=payload, method='POST',
              headers={'Authorization': 'Bearer ${{ secrets.GITHUB_TOKEN }}', 'Accept': 'application/vnd.github+json'}
          )
          print(urllib.request.urlopen(req).read().decode())
          "

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
